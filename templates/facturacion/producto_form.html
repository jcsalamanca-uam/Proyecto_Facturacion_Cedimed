{% extends 'base.html' %}

{% block title %}{{ titulo }} | Cedimed{% endblock %}

{% block content %}
<h2 class="mb-4">{{ titulo }}</h2>
<form method="post">
  {% csrf_token %}
  <div class="card p-4">
    <div class="row g-3">
      {% for field in form %}
      <div class="col-md-6">
        <label class="form-label">{{ field.label }}</label>
        {{ field.errors }}
        {{ field }}
      </div>
      {% endfor %}
    </div>
  </div>
  <div class="mt-4">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'productos_list' %}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
