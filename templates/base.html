<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Cedimed Facturación{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <style>
      body { background: #f4f7fb; }
      .sidebar { min-height: 100vh; background: #0b1f3a; color: white; }
      .nav-link { color: #d9e7ff; }
      .nav-link:hover { color: white; }
      .card { border: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
      .btn-primary { background: #173c75; border-color: #173c75; }
      .btn-primary:hover { background: #122f5d; border-color: #122f5d; }
      .badge-status { font-size: 0.8rem; }
      .table thead th { background: #edf3ff; }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-2 sidebar p-3">
          <h3 class="mb-4">Cedimed</h3>
          <nav class="nav flex-column gap-2">
            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link" href="{% url 'clientes_list' %}">Clientes</a>
            <a class="nav-link" href="{% url 'productos_list' %}">Productos</a>
            <a class="nav-link" href="{% url 'facturas_list' %}">Facturas</a>
            <a class="btn btn-light mt-3" href="{% url 'factura_new' %}">Nueva factura</a>
            <form method="post" action="{% url 'clear_database' %}" class="mt-3" onsubmit="return confirm('ATENCIÓN: esto borrará clientes, productos y facturas. ¿Seguro que quieres continuar?');">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger w-100">Vaciar base de datos</button>
            </form>
          </nav>
        </aside>

        <main class="col-md-10 p-4">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-success mt-2">{{ message }}</div>
            {% endfor %}
          {% endif %}
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
  </body>
</html>
